{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "windrose-k8s.fullname" . }}
  labels:
    {{- include "windrose-k8s.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "windrose-k8s.selectorLabels" . | nindent 6 }}
{{- end }}
